# Troque pelos valores mostrados no SonarQube Cloud
sonar.organization=SEU_USUARIO_OU_ORGANIZACAO
sonar.projectKey=SEU_USUARIO_coleta-veiculos
sonar.projectName=Frota da Coleta

# Código analisado (inclui o Dockerfile para as regras de segurança de contêiner)
sonar.sources=app,config,database,resources,routes,Dockerfile,docker
sonar.tests=tests
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**,public/build/**

# Relatórios gerados pelo PHPUnit na pipeline
sonar.php.coverage.reportPaths=coverage.xml
sonar.php.tests.reportPath=junit.xml
sonar.coverage.exclusions=config/**,database/**,resources/**,routes/**,Dockerfile,docker/**

sonar.sourceEncoding=UTF-8
